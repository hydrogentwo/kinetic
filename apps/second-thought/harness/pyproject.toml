[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-thought"
version = "0.1.0"
description = "Read the conversation on your screen, work out what you mean, and offer it - locally"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []
# Nothing is required. `qrcode` only adds a terminal QR for pairing.

[project.optional-dependencies]
qr = ["qrcode>=7"]

[project.scripts]
second-thought = "secondthought.__main__:main"

[tool.setuptools.packages.find]
include = ["secondthought*"]

[tool.setuptools.package-data]
secondthought = ["web/*"]
